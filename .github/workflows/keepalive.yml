# Consulta liviana a Supabase para que el plan gratis no pause el proyecto por inactividad.
name: Mantener activa la nube
on:
  schedule:
    - cron: "0 12 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 10 \
            -H "apikey: sb_publishable_cqYQhlAYI2lnJXfRgbVUxA_0nOay28o" \
            "https://htxwaeseqxdopimantlw.supabase.co/rest/v1/shopping_data?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
