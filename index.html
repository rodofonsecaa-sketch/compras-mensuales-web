<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Mi Lista Mensual</title>
<style>
:root{
  --bg:#fdf2f8; --card:#ffffff; --ink:#18181b; --muted:#71717a; --line:#f5d0e3;
  --primary:#be185d; --primary-2:#ec4899; --primary-soft:#fce7f3;
  --warn:#18181b; --warn-soft:#f4f4f5; --danger:#18181b; --danger-soft:#f4f4f5;
  --shadow:0 1px 2px rgba(24,24,27,.06),0 8px 24px rgba(190,24,93,.08);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0a0a0a; --card:#171717; --ink:#fafafa; --muted:#a1a1aa; --line:#3a1a2b;
  --primary:#f472b6; --primary-2:#ec4899; --primary-soft:#3b0f26;
  --warn:#fafafa; --warn-soft:#262626; --danger:#f9a8d4; --danger-soft:#3b0f26;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
button{font:inherit;cursor:pointer}
html,body{overflow-x:hidden;max-width:100%}
main{max-width:760px;margin:0 auto;padding:0 16px 72px}

.hero{background:linear-gradient(135deg,#0a0a0a,#27272a 60%,#be185d);color:#fff;margin:0 -16px;padding:28px 20px 70px;border-radius:0 0 32px 32px}
.hero-top{max-width:728px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.hero h1{margin:0;font-size:clamp(26px,6vw,36px);letter-spacing:-.5px}
.hero p{margin:4px 0 0;opacity:.9;font-size:15px}
.month{border:0;border-radius:14px;padding:10px 12px;font:600 15px inherit;background:rgba(255,255,255,.95);color:#18181b;box-shadow:0 4px 14px rgba(0,0,0,.15)}

.progress-card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px 20px;margin-top:-48px;position:sticky;top:10px;z-index:5}
.save-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}
.progress-row span{text-align:right}
.save-row small{color:var(--muted);font-size:13px}
.save{border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:0 6px 16px rgba(236,72,153,.4);transition:.15s}
.save:hover{filter:brightness(1.06)}.save:active{transform:scale(.97)}
.save.ok{background:#18181b;color:#f9a8d4}
.progress-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.progress-row strong{font-size:22px;font-variant-numeric:tabular-nums}
.progress-row span{color:var(--muted);font-size:14px}
.bar{height:12px;border-radius:99px;background:var(--primary-soft);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .35s ease}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 12px}
.search{flex:1 1 220px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 14px 13px 42px;font-size:16px;box-shadow:var(--shadow)}
.search::before{content:"🔎";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px}
.search input:focus,.inline-add input:focus{outline:2px solid var(--primary-2);border-color:transparent}
.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 16px;font-weight:600;box-shadow:var(--shadow)}
.ghost:hover{background:var(--primary-soft)}
.ghost.primary{background:var(--primary);color:#fff;border-color:transparent}
.ghost.primary:hover{filter:brightness(1.08)}
.shop-btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-size:15px;color:var(--primary);background:var(--primary-soft);box-shadow:0 3px 10px rgba(190,24,93,.08);white-space:nowrap}
.shop-btn:hover{filter:brightness(.97)}
.shop-btn.active{background:#18181b;color:#f9a8d4;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.shop-banner{display:none;align-items:center;gap:8px;background:#18181b;color:#f9a8d4;border-radius:14px;padding:11px 14px;font-size:13.5px;font-weight:600;margin:0 0 12px}
body.shopping .shop-banner{display:flex}
.lista-badge{display:none;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:800;white-space:nowrap;vertical-align:middle}
body.shopping .lista-badge{display:inline-block}
body.shopping .qty:not(.bought){display:none}
body.shopping .add-here,body.shopping .inline-add,body.shopping #newModule{display:none!important}
body.shopping .item{grid-template-columns:26px 1fr var(--cw) 34px}
body.shopping .cols{grid-template-columns:26px 1fr var(--cw) 34px}
body.shopping .cols span:nth-child(3){display:none}
@media(max-width:560px){
  body.shopping .item{grid-template-columns:26px minmax(0,1fr) auto;grid-template-areas:"c n r" "c b b"}
}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chip:hover{border-color:var(--primary-2)}
.chip small{color:var(--muted);font-weight:500;margin-left:4px}

section{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin:14px 0;overflow:hidden;scroll-margin-top:110px}
h2{margin:0;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:17px}
.cat-icon{width:40px;height:40px;border-radius:12px;background:var(--primary-soft);display:grid;place-items:center;font-size:21px;flex:none}
.cat-title{flex:1;min-width:0}
.cat-title small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
.cat-bar{height:4px;background:var(--primary-soft);margin:0 16px 4px;border-radius:9px;overflow:hidden}
.cat-bar i{display:block;height:100%;background:var(--primary-2);transition:width .3s}
.add-here{border:0;background:var(--primary-soft);color:var(--primary);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}

.items{padding:2px 8px 8px}
.cols,.item{--cw:112px}
.cols{display:grid;grid-template-columns:26px 1fr var(--cw) var(--cw) 34px;gap:10px;padding:2px 16px 0;font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.cols span:nth-child(3),.cols span:nth-child(4){text-align:center}
.item{display:grid;grid-template-columns:26px 1fr var(--cw) var(--cw) 34px;align-items:center;gap:10px;padding:8px;border-radius:14px;transition:background .15s}
.item:hover{background:color-mix(in srgb,var(--primary-soft) 55%,transparent)}
.item+.item{border-top:1px solid var(--line)}
.check{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:.15s;margin:0}
.check:hover{border-color:var(--primary-2)}
.check:checked{background:var(--primary);border-color:var(--primary)}
.check:checked::after{content:"✓";color:#fff;font-weight:900;font-size:16px;line-height:1}
.name{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.item.done .name{color:var(--muted);text-decoration:line-through}
.qty{width:var(--cw);justify-content:space-between;display:flex;align-items:center;background:var(--primary-soft);border-radius:99px;padding:3px}
.qty button{width:32px;height:32px;border:0;border-radius:50%;background:var(--card);color:var(--primary);font-size:20px;font-weight:700;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.qty button:active{transform:scale(.92)}
.ok-badge{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:2px 9px;border-radius:99px;background:#dcfce7;color:#15803d;font-size:12px;font-weight:800;white-space:nowrap;vertical-align:middle}
.item.ok{background:color-mix(in srgb,#22c55e 9%,transparent)}
.item.ok .name{color:var(--ink);text-decoration:none}
.check:disabled{cursor:default;background:#16a34a;border-color:#16a34a}
@media(prefers-color-scheme:dark){.ok-badge{background:#14532d;color:#86efac}.qty:not(.bought) output{color:#fff}.qty:not(.bought) button{background:#262626;color:#f9a8d4}.save.ok{background:#fafafa;color:#18181b}}
.qty .lbl{display:none}
.qty.bought{background:#18181b;box-shadow:inset 0 0 0 1.5px #ec4899}
.qty.bought output{color:#fff}
.qty.bought button{background:#fff;color:#18181b}
.qty.bought .lbl{color:#f9a8d4}
.qty output{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.remove{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:10px;font-size:16px}
.remove:hover{background:var(--danger-soft);color:var(--danger)}

.undo-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.undo-line button{border:0;background:var(--card);color:var(--warn);border-radius:10px;padding:7px 12px;font-weight:700}

.inline-add{display:none;gap:8px;padding:4px 16px 16px}
.inline-add.open{display:flex}
.inline-add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:16px}
.inline-add button{border:0;border-radius:12px;padding:11px 16px;background:var(--primary);color:#fff;font-weight:700}

.empty{text-align:center;color:var(--muted);padding:40px 10px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:26px}
.confetti{animation:pop .5s ease}
@keyframes pop{50%{transform:scale(1.03)}}
@media(max-width:560px){
  .cols{display:none}
  .item{grid-template-columns:26px minmax(0,1fr) auto;grid-template-areas:"c n r" "c q q" "c b b";row-gap:6px}
  .item .check{grid-area:c;align-self:start;margin-top:2px}.item .name{grid-area:n}.item .remove{grid-area:r}
  .item .qty{width:fit-content}.item .qty:not(.bought){grid-area:q}.item .qty.bought{grid-area:b}
  .qty .lbl{display:inline-block;min-width:78px;font-size:11px;font-weight:700;padding:0 6px 0 10px;color:var(--muted);text-transform:uppercase}
  .ok-badge{margin-left:0;margin-top:4px;display:flex;width:fit-content}
  h2{padding:12px}.cat-bar{margin:0 12px 4px}.items{padding:2px 4px 8px}
}
#historyView{margin-top:6px}
.hist-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.hist-empty{text-align:center;color:var(--muted);padding:40px 10px}
.hist-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--shadow);flex-wrap:wrap}
.hist-card .hist-meta{display:flex;flex-direction:column;gap:2px}
.hist-time{font-weight:800;font-size:15px}
.hist-sub{color:var(--muted);font-size:13px}
.hist-actions{display:flex;gap:8px}
.hist-open-btn{border:0;background:var(--primary);color:#fff;border-radius:12px;padding:9px 14px;font-weight:700}
.hist-del{border:0;background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:9px 11px;font-weight:700}
.hist-detail-head{display:flex;flex-direction:column;gap:2px;margin:4px 4px 14px}
.hist-item{display:grid;grid-template-columns:26px 1fr var(--cw) 34px;align-items:center;gap:10px;padding:8px;border-radius:14px}
.hist-item+.hist-item{border-top:1px solid var(--line)}
.hist-item .lista-badge{display:inline-block}
@media(max-width:560px){.hist-item{grid-template-columns:26px minmax(0,1fr) auto;grid-template-areas:"c n r" "c b b"}.hist-item .check{grid-area:c}.hist-item .name{grid-area:n}.hist-item .qty{grid-area:b}}
@media print{.hero,.toolbar,.chips,.add-here,.remove,.qty button,.progress-card{display:none}section{box-shadow:none;border:1px solid #ccc;break-inside:avoid}}
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="hero-top">
      <div><h1>🛒 Compras de casa</h1><p>Marca lo que compras y no olvides nada.</p></div>
      <input class="month" type="month" id="month" aria-label="Mes de compras">
    </div>
  </div>

  <div class="progress-card" id="progressCard">
    <div class="progress-row"><strong id="count">0 de 0</strong><span id="hello">¡Vamos paso a paso!</span></div>
    <div class="bar"><i id="progress"></i></div>
    <div class="save-row"><small id="savedAt">Aún sin guardar</small><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="save" id="saveList">💾 Guardar compra</button><button class="shop-btn" id="shopMode">🛍️ Modo compra</button></div></div>
  </div>

  <div class="toolbar">
    <label class="search"><input id="search" type="search" placeholder="Buscar un producto…" aria-label="Buscar"></label>
    <button class="ghost" id="copyPrevious">📅 Copiar mes anterior</button>
    <button class="ghost primary" id="newModule">＋ Nuevo módulo</button>
    <button class="ghost" id="openHistory">🕐 Historial</button>
  </div>
  <div class="shop-banner">🛍️ Modo compra: la lista queda fija, solo marca "Comprado" a medida que metes cosas al carro.</div>
  <nav class="chips" id="chips" aria-label="Categorías"></nav>

  <div id="lists"></div>
  <div id="historyView" hidden>
    <div class="hist-toolbar"><button class="ghost" id="histBack">← Volver a la lista</button></div>
    <div id="histBody"></div>
  </div>
  <footer>Tu lista se guarda sola en este navegador y pasa al mes siguiente automáticamente.</footer>
</main>

<script>
const defaults={
 'Despensa':['Arroz','Fideos','Salsa de tomate','Caldo de gallina','Harina','Azúcar','Aceite','Atún','Porotos','Compotas','Jaleas','Leche condensada','Leche','Jugos individuales','Té','Té de canela','Pan rallado','Chispas de chocolate','Crema en caja','Mantequilla'],
 'Refrigerador':['Mayonesa','Ketchup','Mostaza','Queso','Queso rallado','Queso crema','Jamón','Yogur','Salchichas'],
 'Carnes y congelados':['Carne','Carne molida','Pollo / pechuga de pollo','Hamburguesas','Bistec','Chuletas','Lomito','Churrasco','Reineta o salmón'],
 'Frutas y verduras':['Champiñones','Plátano','Frutas o verduras faltantes'],
 'Baño y cuidado personal':['Papel higiénico','Shampoo','Acondicionador','Jabón líquido','Pasta de dientes'],
 'Limpieza del hogar':['Cloro','Limpiador de piso','Lavalozas','Limpiador multiuso','Bolsas de basura','Esponja','Virutilla','Desodorante ambiental'],
 'Colaciones Sofía':['Fruta','Yogurt','Sandwich','Galletas de agua','Barrita de cereal','Jugo individual']};
const icons={'Despensa':'🥫','Refrigerador':'🧀','Carnes y congelados':'❄️','Frutas y verduras':'🍎','Baño y cuidado personal':'🧴','Limpieza del hogar':'🧽','Colaciones Sofía':'🎒'};

const $=s=>document.querySelector(s);
const month=$('#month'), lists=$('#lists'), search=$('#search'), chips=$('#chips');
let lastDeleted=null, wasComplete=false;
const isOk=i=>(Number(i.qty)||0)>0&&(Number(i.bought)||0)>0, isDone=i=>!!i.done||isOk(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>'cat-'+s.normalize('NFD').replace(/[^\w]+/g,'-');

const localMonth=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
month.value=localMonth();
const key=()=>`compras-${month.value}`;
function previousKey(){const [y,m]=month.value.split('-').map(Number);const d=new Date(y,m-2,1);return `compras-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
const itemFactory=name=>({name,qty:0,bought:0,done:false});
const initial=()=>Object.fromEntries(Object.entries(defaults).map(([c,a])=>[c,a.map(itemFactory)]));
const cloneForNewMonth=data=>Object.fromEntries(Object.entries(data).map(([c,items])=>[c,items.map(i=>({...i,done:false,bought:0}))]));
// Agrega categorías nuevas de los valores por defecto (ej. módulos agregados después) sin tocar lo ya guardado.
function withMissingDefaults(data){
  Object.entries(defaults).forEach(([cat,items])=>{ if(!data[cat]) data[cat]=items.map(itemFactory) });
  return data;
}
function load(){
  try{
    const s=localStorage.getItem(key());
    if(s)return withMissingDefaults(JSON.parse(s));
    const p=localStorage.getItem(previousKey());
    return p?withMissingDefaults(cloneForNewMonth(JSON.parse(p))):initial();
  }catch{ return initial() }
}
function save(d){try{localStorage.setItem(key(),JSON.stringify(d))}catch{alert('No se pudo guardar en este navegador.')}}

function render(){
  const data=load(), q=search.value.trim().toLocaleLowerCase();
  lists.innerHTML=''; chips.innerHTML=''; let total=0, done=0;
  Object.entries(data).forEach(([cat,items])=>{
    const matching=items.filter(x=>x.name.toLocaleLowerCase().includes(q));
    if(q&&!matching.length)return;
    const cDone=items.filter(isDone).length;
    total+=matching.length; done+=matching.filter(isDone).length;

    const chip=document.createElement('button');chip.className='chip';
    chip.innerHTML=`${icons[cat]||'📝'} ${esc(cat)}<small>${cDone}/${items.length}</small>`;
    chip.onclick=()=>document.getElementById(slug(cat))?.scrollIntoView({behavior:'smooth'});
    chips.append(chip);

    const sec=document.createElement('section');sec.id=slug(cat);
    sec.innerHTML=`<h2><span class="cat-icon">${icons[cat]||'📝'}</span><span class="cat-title">${esc(cat)}<small>${cDone} de ${items.length} comprados</small></span><button class="add-here">＋ Agregar</button></h2>
      <div class="cat-bar"><i style="width:${items.length?cDone/items.length*100:0}%"></i></div>
      <div class="cols"><span></span><span>Producto</span><span>Lista</span><span>Comprado</span><span></span></div>
      <div class="items"></div>
      <form class="inline-add"><input required placeholder="Agregar a ${esc(cat)}"><button>Guardar</button></form>`;
    const box=sec.querySelector('.items'), add=sec.querySelector('.inline-add');
    sec.querySelector('.add-here').onclick=()=>{add.classList.toggle('open');if(add.classList.contains('open'))add.querySelector('input').focus()};
    add.onsubmit=e=>{e.preventDefault();const v=add.querySelector('input').value.trim();if(v){data[cat].push(itemFactory(v));save(data);render()}};

    matching.forEach(item=>{
      const n=Number(item.qty)||0, b=Number(item.bought)||0, ok=isOk(item), row=document.createElement('div');
      row.className='item'+(ok?' ok':item.done?' done':'');
      row.innerHTML=`<input type="checkbox" class="check" ${item.done||ok?'checked':''} ${ok?'disabled title="Comprado: Lista y Comprado tienen cantidad"':''} aria-label="Marcar ${esc(item.name)}">
        <span class="name">${esc(item.name)}${n>0?`<span class="lista-badge">🧾 Lista: ${n}</span>`:''}${ok?'<em class="ok-badge">✓ Comprado</em>':''}</span>
        <div class="qty" role="group" aria-label="Cantidad estimada de ${esc(item.name)}"><span class="lbl">Lista</span><button class="minus" aria-label="Restar lista">−</button><output>${n}</output><button class="plus" aria-label="Sumar lista">+</button></div>
        <div class="qty bought" role="group" aria-label="Cantidad comprada de ${esc(item.name)}"><span class="lbl">Comprado</span><button class="bminus" aria-label="Restar comprado">−</button><output>${b}</output><button class="bplus" aria-label="Sumar comprado">+</button></div>
        <button class="remove" title="Eliminar ${esc(item.name)}" aria-label="Eliminar ${esc(item.name)}">🗑</button>`;
      row.querySelector('.check').onchange=e=>{item.done=e.target.checked;save(data);render()};
      row.querySelector('.minus').onclick=()=>{item.qty=Math.max(0,n-1);save(data);render()};
      row.querySelector('.plus').onclick=()=>{item.qty=n+1;save(data);render()};
      row.querySelector('.bminus').onclick=()=>{item.bought=Math.max(0,b-1);save(data);render()};
      row.querySelector('.bplus').onclick=()=>{item.bought=b+1;save(data);render()};
      row.querySelector('.remove').onclick=()=>{lastDeleted={cat,item,index:data[cat].indexOf(item)};data[cat]=data[cat].filter(x=>x!==item);save(data);render()};
      box.append(row);
    });
    if(lastDeleted&&lastDeleted.cat===cat){
      const u=document.createElement('div');u.className='undo-line';
      u.innerHTML=`<span>Se eliminó <strong>${esc(lastDeleted.item.name)}</strong></span><button>↩ Deshacer</button>`;
      u.querySelector('button').onclick=()=>{const d=load();if(!d[lastDeleted.cat])d[lastDeleted.cat]=[];d[lastDeleted.cat].splice(lastDeleted.index,0,lastDeleted.item);save(d);lastDeleted=null;render()};
      box.append(u);
    }
    lists.append(sec);
  });
  if(!lists.children.length)lists.innerHTML='<div class="empty">No encontré productos con esa búsqueda 🤔</div>';
  const complete=total>0&&done===total;
  $('#count').textContent=`${done} de ${total}`;
  $('#hello').textContent=complete?'¡Lista completa! 🎉':done?'¡Vas muy bien! 💚':'¡Vamos paso a paso!';
  $('#progress').style.width=(total?done/total*100:0)+'%';
  if(complete&&!wasComplete){const c=$('#progressCard');c.classList.remove('confetti');void c.offsetWidth;c.classList.add('confetti')}
  wasComplete=complete;
}
const stampKey=()=>`compras-guardado-${month.value}`;
function showStamp(){let t='';try{t=localStorage.getItem(stampKey())||''}catch{}$('#savedAt').textContent=t?`Guardada el ${t}`:'Aún sin guardar'}
$('#saveList').onclick=()=>{
  const _d=load();
  save(_d);
  pushHistorySnapshot(_d);
  const t=new Date().toLocaleString('es-CL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  try{localStorage.setItem(stampKey(),t)}catch{}
  const b=$('#saveList');b.textContent='✓ Compra guardada';b.classList.add('ok');showStamp();
  setTimeout(()=>{b.textContent='💾 Guardar compra';b.classList.remove('ok')},2000);
};
month.onchange=()=>{lastDeleted=null;render();showStamp()};
search.oninput=render;
$('#copyPrevious').onclick=()=>{
  const raw=localStorage.getItem(previousKey());
  if(!raw){alert('No hay una lista guardada para el mes anterior.');return}
  if(!confirm('¿Copiar los productos del mes anterior? Se reemplazará la lista del mes actual.'))return;
  try{save(cloneForNewMonth(JSON.parse(raw)));lastDeleted=null;render()}catch{alert('No se pudo copiar la lista anterior.')}
};
$('#newModule').onclick=()=>{
  const name=prompt('Nombre del módulo nuevo (ej: Colaciones, Ferretería):');
  if(!name)return; const clean=name.trim(); if(!clean)return;
  const data=load();
  if(data[clean]){alert('Ya existe un módulo con ese nombre.');return}
  data[clean]=[]; save(data); render();
  document.getElementById(slug(clean))?.scrollIntoView({behavior:'smooth'});
};
const shopBtn=$('#shopMode');
function applyShopMode(){
  const on=document.body.classList.contains('shopping');
  shopBtn.classList.toggle('active',on);
  shopBtn.textContent=on?'✏️ Volver a editar':'🛍️ Modo compra';
}
try{ if(localStorage.getItem('modo-compra')==='1') document.body.classList.add('shopping') }catch{}
applyShopMode();
shopBtn.onclick=()=>{
  document.body.classList.toggle('shopping');
  try{localStorage.setItem('modo-compra', document.body.classList.contains('shopping')?'1':'0')}catch{}
  applyShopMode();
};
/* ---------- Historial de listas guardadas ---------- */
function loadHistory(){ try{ return JSON.parse(localStorage.getItem('historial-guardados')||'[]') }catch{ return [] } }
function saveHistoryArr(arr){ try{ localStorage.setItem('historial-guardados', JSON.stringify(arr)) }catch{} }
function pushHistorySnapshot(data){
  const now=new Date();
  const entry={id:'h'+now.getTime(), tsRaw:now.toISOString(),
    ts:now.toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}),
    mes:month.value, data:JSON.parse(JSON.stringify(data))};
  const arr=loadHistory(); arr.unshift(entry);
  if(arr.length>60) arr.length=60;
  saveHistoryArr(arr);
}
function persistHistoryEntry(entry){
  const arr=loadHistory(); const idx=arr.findIndex(x=>x.id===entry.id);
  if(idx>-1){ arr[idx]=entry; saveHistoryArr(arr); }
}
const historyView=$('#historyView'), histBody=$('#histBody'), histBack=$('#histBack'), shopBanner=document.querySelector('.shop-banner');
let histDetailId=null;
function showHistoryList(){
  histDetailId=null;
  lists.hidden=true; chips.hidden=true; if(shopBanner)shopBanner.hidden=true;
  historyView.hidden=false;
  renderHistoryList();
}
function closeHistory(){
  lists.hidden=false; chips.hidden=false; if(shopBanner)shopBanner.hidden=false;
  historyView.hidden=true;
}
histBack.onclick=()=>{ if(histDetailId){ histDetailId=null; renderHistoryList(); } else { closeHistory(); } };
$('#openHistory').onclick=showHistoryList;
function renderHistoryList(){
  histBack.textContent='← Volver a la lista';
  const arr=loadHistory();
  if(!arr.length){ histBody.innerHTML='<div class="hist-empty">Aún no has guardado ninguna lista. Presiona "💾 Guardar compra" para crear la primera 📋</div>'; return; }
  histBody.innerHTML='';
  arr.forEach(entry=>{
    const flat=Object.values(entry.data).flat();
    const total=flat.length, done=flat.filter(isDone).length;
    const card=document.createElement('div'); card.className='hist-card';
    card.innerHTML=`<div class="hist-meta"><span class="hist-time">🕐 ${esc(entry.ts)}</span><span class="hist-sub">${done} de ${total} comprados</span></div>
      <div class="hist-actions"><button class="hist-open-btn">Abrir →</button><button class="hist-del" title="Eliminar" aria-label="Eliminar lista guardada">🗑</button></div>`;
    card.querySelector('.hist-open-btn').onclick=()=>{ histDetailId=entry.id; renderHistoryDetail(entry); };
    card.querySelector('.hist-del').onclick=()=>{
      if(!confirm(`¿Eliminar la lista guardada del ${entry.ts}? No se puede deshacer.`))return;
      saveHistoryArr(loadHistory().filter(x=>x.id!==entry.id));
      renderHistoryList();
    };
    histBody.append(card);
  });
}
function renderHistoryDetail(entry){
  histBack.textContent='← Volver al historial';
  histBody.innerHTML='';
  const head=document.createElement('div'); head.className='hist-detail-head';
  head.innerHTML=`<strong class="hist-time">🕐 ${esc(entry.ts)}</strong><span class="hist-sub">Solo marca "Comprado". Lo demás queda tal como lo guardaste.</span>`;
  histBody.append(head);
  const data=entry.data; let total=0,done=0;
  Object.entries(data).forEach(([cat,items])=>{
    if(!items.length)return;
    const cDone=items.filter(isDone).length; total+=items.length; done+=cDone;
    const sec=document.createElement('section');
    sec.innerHTML=`<h2><span class="cat-icon">${icons[cat]||'📝'}</span><span class="cat-title">${esc(cat)}<small>${cDone} de ${items.length} comprados</small></span></h2>
      <div class="cat-bar"><i style="width:${items.length?cDone/items.length*100:0}%"></i></div>
      <div class="items"></div>`;
    const box=sec.querySelector('.items');
    items.forEach(item=>{
      const n=Number(item.qty)||0, b=Number(item.bought)||0, ok=isOk(item), row=document.createElement('div');
      row.className='item hist-item'+(ok?' ok':item.done?' done':'');
      row.innerHTML=`<input type="checkbox" class="check" ${item.done||ok?'checked':''} ${ok?'disabled title="Comprado: Lista y Comprado tienen cantidad"':''} aria-label="Marcar ${esc(item.name)}">
        <span class="name">${esc(item.name)}${n>0?`<span class="lista-badge">🧾 Lista: ${n}</span>`:''}${ok?'<em class="ok-badge">✓ Comprado</em>':''}</span>
        <div class="qty bought" role="group" aria-label="Cantidad comprada de ${esc(item.name)}"><button class="bminus" aria-label="Restar comprado">−</button><output>${b}</output><button class="bplus" aria-label="Sumar comprado">+</button></div>`;
      row.querySelector('.check').onchange=e=>{item.done=e.target.checked;persistHistoryEntry(entry);renderHistoryDetail(entry)};
      row.querySelector('.bminus').onclick=()=>{item.bought=Math.max(0,b-1);persistHistoryEntry(entry);renderHistoryDetail(entry)};
      row.querySelector('.bplus').onclick=()=>{item.bought=b+1;persistHistoryEntry(entry);renderHistoryDetail(entry)};
      box.append(row);
    });
    histBody.append(sec);
  });
  const foot=document.createElement('div'); foot.className='hist-sub'; foot.style.textAlign='center'; foot.style.margin='14px 0';
  foot.textContent=`${done} de ${total} comprados en esta lista guardada`;
  histBody.append(foot);
}

render();showStamp();
</script>
</body>
</html>
