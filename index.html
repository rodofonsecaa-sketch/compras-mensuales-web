<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Lista Mensual</title>
  <style>
    :root { --ink:#31413b; --muted:#68766f; --paper:#fffdf8; --sage:#e7f1ea; --accent:#207a5d; --line:#dbe4dc; --warm:#fff0d8; --pink:#f8dfe6; }
    * { box-sizing:border-box } body { margin:0; background:radial-gradient(circle at top left,#fff4d7 0,transparent 32%),linear-gradient(130deg,#edf7f0,#fff8ee); font-family:Arial,sans-serif; color:var(--ink) }
    main { max-width:860px; margin:0 auto; padding:30px 16px 64px } header { display:flex; justify-content:space-between; gap:15px; align-items:end; margin-bottom:22px }
    h1 { margin:0; font-size:clamp(28px,5vw,43px); letter-spacing:-1.5px } .subtitle { margin:7px 0 0; color:var(--muted) }
    .month { border:1px solid var(--line); background:#fff; border-radius:14px; padding:11px; font-weight:bold; color:var(--ink); font-size:16px; box-shadow:0 3px 10px #7c8b8112 }
    .summary { background:linear-gradient(135deg,#345c4e,#1f8060); color:white; border-radius:22px; padding:20px 22px; display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:22px; box-shadow:0 10px 22px #39735c22 }
    .summary small { opacity:.72; display:block; margin-bottom:4px }.summary strong { font-size:25px }.bar { width:45%; height:10px; border-radius:20px; background:#50655b; overflow:hidden }.bar i { display:block; height:100%; background:#badc7f; width:0%; transition:.2s }
    .tools { display:flex; flex-wrap:wrap; gap:9px; margin-bottom:12px }.tools input { flex:1 1 200px; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:16px }.tools button, .add button, .actions button { border:0; border-radius:11px; padding:11px 15px; font-weight:bold; cursor:pointer; background:var(--sage); color:var(--ink) }.tools .danger, .actions .delete-mode { background:#f7dddd; color:#8a2f2f }.actions { display:flex; gap:9px; flex-wrap:wrap; margin:0 0 19px }.actions .add-product { background:var(--accent); color:#fff }.actions .undo { background:#fff0d8; color:#765217 }.actions button[hidden] { display:none }
    section { background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:20px; margin:13px 0; overflow:hidden; box-shadow:0 5px 15px #5e77620d } h2 { font-size:15px; letter-spacing:.3px; padding:11px 14px 11px 18px; margin:0; background:var(--warm); display:flex; align-items:center; justify-content:space-between; gap:10px } h2 button { border:0; border-radius:10px; padding:8px 11px; background:#fff; color:var(--accent); font-weight:bold; cursor:pointer; box-shadow:0 2px 6px #936d2c18 }.items { padding:4px 14px 12px }.inline-add { display:none; gap:8px; padding:0 14px 14px }.inline-add.open { display:flex }.inline-add input { flex:1; min-width:0; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:15px }.inline-add button { border:0; border-radius:10px; padding:10px 13px; background:var(--accent); color:#fff; font-weight:bold; cursor:pointer }
    .item { display:grid; grid-template-columns:28px 1fr 70px auto; align-items:center; gap:8px; min-height:48px; border-bottom:1px solid #edf0ed }.item:last-child { border:0 }.item input[type=checkbox] { width:19px; height:19px; accent-color:var(--accent); cursor:pointer }.item.done .name { text-decoration:line-through; color:#8a9690 }.qty { width:100%; padding:7px 5px; border:1px solid var(--line); border-radius:8px; text-align:center; color:var(--ink); background:white }.remove { display:none; border:0; background:#f9e1e1; color:#9f3434; border-radius:8px; padding:7px 9px; font-weight:bold; cursor:pointer }.remove.show { display:block }.add { display:none; gap:8px; margin-top:20px; padding:14px; background:#fff; border:1px solid var(--line); border-radius:16px }.add.open { display:flex }.add input { flex:1; border:1px solid var(--line); border-radius:11px; padding:12px; font-size:16px }.add select { border:1px solid var(--line); border-radius:11px; padding:9px; background:#fff }
    footer { text-align:center; color:var(--muted); font-size:13px; margin-top:22px } @media(max-width:560px) { header{align-items:stretch;flex-direction:column}.month{width:100%}.summary{align-items:flex-start;flex-direction:column}.bar{width:100%}.add{flex-wrap:wrap}.add input{min-width:100%} }
  </style>
</head>
<body><main>
  <header><div><h1>🛒 Compras de casa</h1><p class="subtitle">Tu ayudita para comprar con calma y sin olvidar nada.</p></div><input class="month" type="month" id="month" aria-label="Mes de compras"></header>
  <div class="summary"><div><small id="hello">¡Vamos paso a paso!</small><strong id="count">0 de 0 comprados</strong></div><div class="bar"><i id="progress"></i></div></div>
  <div class="tools"><input id="search" placeholder="🔎 Buscar un producto…"><button id="copy">📋 Copiar pendientes</button><button class="danger" id="reset">↺ Desmarcar todo</button></div>
  <div class="actions"><button class="delete-mode" id="toggleDelete">🗑️ Eliminar productos</button><button class="undo" id="undoDelete" hidden>↩ Deshacer eliminación</button></div>
  <div id="lists"></div>
  <footer>✨ Tu lista queda guardada en este navegador, mes a mes.</footer>
</main><script>
const defaults={
 'Despensa':['Arroz','Fideos','Salsa de tomate','Caldo de gallina','Harina','Azúcar','Aceite','Atún','Porotos','Compotas','Jaleas','Leche condensada','Leche','Jugos individuales','Té','Té de canela','Pan rallado','Chispas de chocolate','Crema en caja','Mantequilla'],
 'Refrigerador':['Mayonesa','Ketchup','Mostaza','Queso','Queso rallado','Queso crema','Jamón','Yogur','Salchichas'],
 'Carnes y congelados':['Carne','Carne molida','Pollo / pechuga de pollo','Hamburguesas','Bistec','Chuletas','Lomito','Churrasco','Reineta o salmón'],
 'Frutas y verduras':['Champiñones','Plátano','Frutas o verduras faltantes'],
 'Baño y cuidado personal':['Papel higiénico','Shampoo','Acondicionador','Jabón líquido','Pasta de dientes'],
 'Limpieza del hogar':['Cloro','Limpiador de piso','Lavalozas','Limpiador multiuso','Bolsas de basura','Esponja','Virutilla','Desodorante ambiental'] };
const month=document.querySelector('#month'), lists=document.querySelector('#lists'), search=document.querySelector('#search'); let deleteMode=false,lastDeleted=null;
month.value=new Date().toISOString().slice(0,7); const key=()=>`compras-${month.value}`;
function initial(){return Object.fromEntries(Object.entries(defaults).map(([c,a])=>[c,a.map(name=>({name,qty:'',done:false}))]));}
function load(){try{return JSON.parse(localStorage.getItem(key()))||initial()}catch{return initial()}} function save(data){localStorage.setItem(key(),JSON.stringify(data))}
const icons={'Despensa':'🥫','Refrigerador':'🧀','Carnes y congelados':'❄️','Frutas y verduras':'🍎','Baño y cuidado personal':'🧴','Limpieza del hogar':'🧽'};
function render(){const data=load(), q=search.value.trim().toLocaleLowerCase();lists.innerHTML=''; let total=0,done=0;
Object.entries(data).forEach(([cat,items])=>{const matching=items.filter(x=>x.name.toLocaleLowerCase().includes(q)); if(q&&!matching.length)return; const sec=document.createElement('section');sec.innerHTML=`<h2><span>${icons[cat]||'📝'} ${cat}</span><button class="add-here">＋ Agregar</button></h2><div class="items"></div><form class="inline-add"><input required placeholder="Agregar a ${cat}"><button>Guardar</button></form>`; const box=sec.querySelector('.items'), add=sec.querySelector('.inline-add');sec.querySelector('.add-here').onclick=()=>{add.classList.toggle('open');if(add.classList.contains('open'))add.querySelector('input').focus()};add.onsubmit=e=>{e.preventDefault();const input=add.querySelector('input');if(input.value.trim()){data[cat].push({name:input.value.trim(),qty:'',done:false});save(data);render()}};matching.forEach(item=>{total++;if(item.done)done++;const row=document.createElement('div');row.className='item '+(item.done?'done':'');row.innerHTML=`<input type="checkbox" ${item.done?'checked':''} aria-label="Marcar ${item.name}"><span class="name">${item.name}</span><input class="qty" value="${item.qty}" placeholder="Cant."><button class="remove ${deleteMode?'show':''}" title="Eliminar ${item.name}">Eliminar</button>`;row.querySelector('[type=checkbox]').onchange=e=>{item.done=e.target.checked;save(data);render()};row.querySelector('.qty').onchange=e=>{item.qty=e.target.value;save(data)};row.querySelector('.remove').onclick=()=>{lastDeleted={cat,item,index:data[cat].indexOf(item)};data[cat]=data[cat].filter(x=>x!==item);save(data);render()};box.append(row)});lists.append(sec)});
document.querySelector('#count').textContent=`${done} de ${total} comprados`;document.querySelector('#hello').textContent=done===total&&total?'¡Excelente, lista completa! 🎉':done?'¡Vas muy bien! Sigue así 💚':'¡Vamos paso a paso!';document.querySelector('#progress').style.width=(total?done/total*100:0)+'%';document.querySelector('#undoDelete').hidden=!lastDeleted;}
month.onchange=()=>{lastDeleted=null;render()};search.oninput=render;document.querySelector('#toggleDelete').onclick=()=>{deleteMode=!deleteMode;document.querySelector('#toggleDelete').textContent=deleteMode?'✓ Terminar de eliminar':'🗑️ Eliminar productos';render()};document.querySelector('#undoDelete').onclick=()=>{if(!lastDeleted)return;const d=load();if(!d[lastDeleted.cat])d[lastDeleted.cat]=[];d[lastDeleted.cat].splice(lastDeleted.index,0,lastDeleted.item);save(d);lastDeleted=null;render()};
document.querySelector('#reset').onclick=()=>{const d=load();Object.values(d).flat().forEach(x=>x.done=false);save(d);render()};document.querySelector('#copy').onclick=async()=>{const d=load(),t=Object.entries(d).map(([c,x])=>{const p=x.filter(i=>!i.done).map(i=>`• ${i.name}${i.qty?' ('+i.qty+')':''}`).join('\n');return p?`${c}\n${p}`:''}).filter(Boolean).join('\n\n');try{await navigator.clipboard.writeText(t);alert('Pendientes copiados.')}catch{prompt('Copia esta lista:',t)}};render();
</script></body></html>
